<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="MEDION 14 S1 OLED — Linux fixes">
  <!--
    Icono del proyecto de drivers. Un teclado con el LED de Bloq Mayús
    encendido: las dos cosas que arregla el driver (scancodes del teclado
    interno y un LED que nunca se implementó).

    Tile oscuro a propósito: la superficie "ink" del sitio siempre es oscura,
    así que el icono no necesita adaptarse a tema claro. Los colores salen de
    los tokens de esa superficie (app/globals.css): fondo ink-surface #141414,
    trazo ink-fg-strong #ffffff y el LED en ink-ok.
  -->
  <rect width="48" height="48" fill="#141414"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="13.5" width="36" height="21" rx="4"/>
    <path d="M16.5 30h15"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="14.5" cy="19.5" r="1.3"/>
    <circle cx="20.5" cy="19.5" r="1.3"/>
    <circle cx="26.5" cy="19.5" r="1.3"/>
    <circle cx="32.5" cy="19.5" r="1.3"/>
    <circle cx="12.5" cy="24.75" r="1.3"/>
    <circle cx="18.5" cy="24.75" r="1.3"/>
    <circle cx="24.5" cy="24.75" r="1.3"/>
    <circle cx="30.5" cy="24.75" r="1.3"/>
    <circle cx="36.5" cy="24.75" r="1.3"/>
  </g>
  <circle cx="9.8" cy="19.5" r="1.7" fill="#00C48F"/>
</svg>
